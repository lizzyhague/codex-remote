<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171a21">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="通过私人网络使用远程主机上的 Codex">
    <link rel="manifest" href="/manifest.webmanifest?v=15">
    <link rel="icon" href="/icon-192.png?v=13" type="image/png" sizes="192x192">
    <link rel="stylesheet" href="/styles.css?v=27">
    <title>Codex Remote</title>
  </head>
  <body>
    <section id="login-view" class="login-view">
      <form id="token-form" class="login-card">
        <div class="login-brand">
          <img class="login-icon" src="/icon-192.png?v=13" alt="">
          <h1>Codex Remote</h1>
        </div>
        <p class="login-hint">令牌只保存在这个浏览器里</p>
        <label for="token-input">访问令牌</label>
        <input id="token-input" type="password" autocomplete="current-password" required>
        <button id="connect-button" class="primary" type="submit">连接</button>
        <p id="login-status" class="form-status" aria-live="polite"></p>
      </form>
    </section>

    <div id="app-view" class="app-view" data-sidebar-collapsed="false" data-mobile-sidebar-open="false" hidden>
      <aside id="session-sidebar" class="session-sidebar" aria-label="会话导航">
        <div class="sidebar-heading">
          <div class="sidebar-brand">
            <img class="sidebar-logo" src="/icon-192.png?v=13" alt="">
            <strong>会话</strong>
          </div>
          <button id="collapse-sidebar-button" class="quiet small" type="button" aria-label="收起会话列表">收起</button>
        </div>

        <div class="project-controls">
          <label>
            <span class="visually-hidden">项目</span>
            <select id="project-select" aria-label="项目"></select>
          </label>
          <button id="new-session-button" type="button">＋ 新会话</button>
        </div>

        <label class="session-search">
          <span class="visually-hidden">搜索会话</span>
          <input id="session-search-input" type="search" maxlength="256" placeholder="搜索会话">
        </label>

        <div class="session-list-heading">
          <button id="session-view-back-button" class="quiet small" type="button" hidden>← 会话</button>
          <strong id="session-view-title">最近会话</strong>
          <button id="select-sessions-button" class="quiet small" type="button">选择</button>
        </div>

        <div id="selection-heading" class="selection-heading" hidden>
          <button id="cancel-selection-button" class="quiet small" type="button">取消</button>
          <div class="selection-heading-end">
            <strong id="selection-count">已选择 0 项</strong>
            <button id="select-all-sessions-button" class="quiet small" type="button">全选</button>
          </div>
        </div>

        <div id="session-list" class="session-list" role="list" aria-live="polite"></div>
        <button id="load-more-sessions-button" class="quiet load-more-sessions" type="button" hidden>加载更多</button>

        <nav id="session-destinations" class="session-destinations" aria-label="会话分类">
          <button id="archived-sessions-button" class="quiet" type="button">已归档</button>
          <button id="trash-sessions-button" class="quiet" type="button">回收站</button>
        </nav>

        <div id="bulk-session-actions" class="bulk-session-actions" hidden>
          <button id="bulk-primary-button" type="button">归档</button>
          <button id="bulk-trash-button" class="danger" type="button">删除</button>
        </div>
      </aside>

      <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="关闭会话列表" tabindex="-1"></button>

      <section class="conversation-shell">
        <header class="app-header">
          <div class="conversation-heading">
            <button id="open-sidebar-button" class="quiet sidebar-open-button" type="button" aria-label="打开会话列表">☰</button>
            <div>
              <div class="conversation-title-row">
                <strong id="current-session-title">Codex Remote</strong>
              <span id="connection-status" class="connection-status" data-state="connecting">正在连接</span>
              </div>
              <div id="session-metrics" class="session-metrics" hidden></div>
            </div>
          </div>
        </header>

        <main id="timeline" class="timeline" aria-live="polite">
          <div id="history-loader" class="history-loader" hidden>
            <button id="load-older-button" class="quiet small" type="button">加载更早</button>
          </div>
          <div id="empty-state" class="empty-state">
            <p>选择以前的会话，或者新建一个会话。</p>
          </div>
          <div id="thinking-indicator" class="thinking-indicator" role="status" hidden>
            <span id="thinking-label">正在思考</span>
            <span class="thinking-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          </div>
        </main>

        <aside id="approval-list" class="approval-list" aria-live="assertive"></aside>

        <div id="notice" class="notice" role="status" hidden>
          <span id="notice-text"></span>
          <button id="notice-action-button" class="quiet small" type="button" hidden></button>
        </div>

        <form id="composer" class="composer">
          <div id="slash-menu" class="slash-menu" role="listbox" hidden></div>
          <div id="composer-picker-menu" class="composer-picker-menu" role="listbox" hidden></div>
          <input id="attachment-input" class="visually-hidden" type="file" multiple tabindex="-1">
          <div id="attachment-list" class="attachment-list" aria-live="polite" hidden></div>
          <textarea
            id="message-input"
            rows="1"
            maxlength="524288"
            placeholder="先选择或新建会话"
            aria-label="消息"
            disabled
          ></textarea>
          <div class="composer-actions">
            <span class="composer-hint">电脑可按 Ctrl / ⌘ + Enter 发送</span>
            <div class="composer-action-scroll" aria-label="快捷操作">
              <button id="command-menu-button" class="quiet composer-shortcut command-menu-button" type="button" aria-label="更多操作" title="更多操作" aria-haspopup="listbox" aria-controls="slash-menu" disabled>+</button>
              <button id="model-picker-button" class="quiet composer-select-button" type="button" aria-haspopup="listbox" aria-controls="composer-picker-menu" aria-expanded="false" disabled>
                <span class="composer-control-name">模型</span>
                <span id="model-picker-label" class="composer-control-value">默认</span>
                <svg class="composer-control-chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
              </button>
              <button id="permission-picker-button" class="quiet composer-select-button" type="button" aria-haspopup="listbox" aria-controls="composer-picker-menu" aria-expanded="false" disabled>
                <span class="composer-control-name">权限</span>
                <span id="permission-picker-label" class="composer-control-value">默认</span>
                <svg class="composer-control-chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
              </button>
            </div>
            <button id="task-button" class="primary task-button" type="submit" disabled>发送</button>
          </div>
        </form>
      </section>
    </div>

    <dialog id="app-alert-dialog" class="app-alert-dialog" aria-labelledby="app-alert-title" aria-describedby="app-alert-message">
      <form method="dialog">
        <h2 id="app-alert-title">提示</h2>
        <p id="app-alert-message"></p>
        <div class="rename-actions">
          <button class="primary" type="submit" autofocus>知道了</button>
        </div>
      </form>
    </dialog>
    <dialog id="rename-dialog" aria-labelledby="rename-heading">
      <form id="rename-form">
        <h2 id="rename-heading">重命名</h2>
        <label for="rename-input">会话名称</label>
        <input id="rename-input" type="text" maxlength="160" required autocomplete="off">
        <p id="rename-status" role="status"></p>
        <div class="rename-actions">
          <button id="rename-cancel" type="button">取消</button>
          <button id="rename-save" class="primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>
    <script src="/boot.js?v=12"></script>
    <script type="module" src="/slash-menu.js?v=16"></script>
    <script type="module" src="/app.js?v=30"></script>
  </body>
</html>
